<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="760" height="320" fill="#0f1115"/><text x="40" y="44" fill="#f8fafc" font-size="22" font-weight="700">Reading a cell code: <tspan fill="#d97706">F4</tspan></text><rect x="40" y="78" width="150" height="150" rx="16" fill="rgba(217,119,6,0.16)" stroke="#d97706" stroke-width="2"/><text x="115" y="150" fill="#d97706" font-size="56" font-weight="800" text-anchor="middle">F4</text><text x="115" y="190" fill="#f1f5f9" font-size="20" font-weight="600" text-anchor="middle">Profitability</text><text x="260" y="108" fill="#94a3b8" font-size="13">LETTER → pillar (the column)</text><rect x="260" y="118" width="44" height="44" rx="8" fill="#2563eb"/><text x="282" y="147" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">F</text><text x="318" y="139" fill="#f1f5f9" font-size="18" font-weight="600">Finance</text><text x="318" y="158" fill="#64748b" font-size="12">money in, money out, money kept</text><text x="260" y="196" fill="#94a3b8" font-size="13">NUMBER → dimension (the row)</text><rect x="260" y="206" width="44" height="44" rx="8" fill="#475569"/><text x="282" y="235" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">4</text><text x="318" y="227" fill="#f1f5f9" font-size="18" font-weight="600">Efficiency</text><text x="318" y="246" fill="#64748b" font-size="12">output achieved per unit of input</text><text x="40" y="288" fill="#94a3b8" font-size="14">Finance × Efficiency  =  <tspan fill="#f1f5f9" font-weight="600">F4 “Profitability”</tspan></text></svg>